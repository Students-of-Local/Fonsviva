[package]
name = "fonsviva"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
fonsviva-core = { path = "../fonsviva-core" }
fonsviva-wire = { path = "../fonsviva-wire" }
fonsviva-runpod = { path = "../fonsviva-runpod" }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "process", "fs", "io-util", "net", "time", "sync", "signal"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
anyhow = "1.0.104"
futures-util = "0.3.34"
bytes = "1.12.1"
clap = { version = "4.6.8", features = ["derive"] }
axum = { version = "0.8.9", default-features = false, features = ["tokio", "http1", "json", "query"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json", "http2"] }
getrandom = "0.4.3"
sha2 = "0.11.1"
rusqlite = { version = "0.43", features = ["bundled"] }
url = "2.5.8"

[dev-dependencies]
tempfile = "3.27.0"
