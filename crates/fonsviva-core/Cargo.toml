[package]
name = "fonsviva-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow = "1.0.104"
bytes = "1.12.1"
flate2 = "1.1.11"
futures-util = "0.3.34"
getrandom = "0.4.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json", "http2"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
snow = "0.10.0"
socket2 = { version = "0.6.5", features = ["all"] }
spake2 = "0.4.0"
libc = "0.2.191"
sysinfo = { version = "0.40.4", default-features = false, features = ["system", "disk"] }
tar = "0.4.46"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "process", "fs", "io-util", "net", "time", "sync", "signal"] }
zip = { version = "9.6.1", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3.27.0"
