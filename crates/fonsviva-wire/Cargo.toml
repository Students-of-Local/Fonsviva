[package]
name = "fonsviva-wire"
description = "One-click, reversible config writers that point pi, T3 Code, Eukhe and OpenAI clients at Fonsviva"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
keyring = "4.2.0"
secrecy = "0.10.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"

[dev-dependencies]
tempfile = "3.27.0"
