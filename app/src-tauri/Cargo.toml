[package]
name = "fonsviva-app"
version = "0.1.0"
description = "Fonsviva: run local AI models on your own computer."
authors = ["Donovan Baney"]
license = "MIT"
edition = "2024"

# The desktop app builds on its own so the daemon crates' CI never needs WebKit.
[workspace]

[lib]
name = "fonsviva_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", features = ["json"] }
dirs = "6"
hmac = "0.12"
sha2 = "0.10"
getrandom = "0.3"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 4
strip = "debuginfo"
