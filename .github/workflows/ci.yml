name: ci
on:
  pull_request:
  push:
    branches: [main, stable]
jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - if: runner.os != 'Windows'
        run: cargo build -p fonsviva --locked && scripts/tests/version-test.sh target/debug/fonsviva
      - if: runner.os != 'Windows'
        run: scripts/tests/release-sums-test.sh
      - if: runner.os != 'Windows'
        run: scripts/tests/check-tag-test.sh
  install:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - if: runner.os == 'Linux'
        run: shellcheck install.sh scripts/tests/install-test.sh
      - run: cargo build -p fonsviva --locked
      - run: scripts/tests/install-test.sh target/debug/fonsviva
